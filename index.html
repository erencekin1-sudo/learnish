<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Learnish • İngilizce Kelime Platformu (MEB, YDS &amp; Oxford 5000)</title>
  
  <!-- Meta & SEO -->
  <meta name="description" content="Learnish: MEB İngilizce Müfredatı (5. Sınıf Maarif Modeli), YDS/YÖKDİL Akademik Hazırlık ve The Oxford 5000 (A1-C1) 9.234 kelimelik interaktif İngilizce kelime çalışma platformu.">
  <meta name="theme-color" content="#eeebe3">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Learnish">
  
  <!-- App Icons & Manifest -->
  <link rel="icon" type="image/png" href="favicon.png?v=codex2">
  <link rel="apple-touch-icon" href="icon-192.png?v=codex2">
  <link rel="manifest" href="manifest.json">
  
  <!-- Typography: Nunito (400 to 900) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400;1,700;1,900&display=swap" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="app.css?v=modern1">
</head>
<body>

  <!-- SINGLE-COLUMN APP SHELL -->
  <div class="app-shell">

    <!-- 1. TOP-ALIGNED HEADER (56px Top Padding) -->
    <header class="app-top-header" role="banner">
      <div class="header-greeting-wrap">
        <span class="header-greeting-label" id="header-greeting-label">GÜNLÜK HEDEF • LEARNISH</span>
        <h1 class="header-greeting-title" id="header-user-title">MEB Müfredatı</h1>
      </div>
      <button type="button" class="header-profile-btn" id="header-profile-trigger" onclick="window.APP.openSettingsModal()" aria-label="Ayarlar ve Profil">
        <div class="header-avatar-circle">
          <img src="icon-192.png" alt="Learnish Profil" class="header-avatar-img">
          <span class="header-notification-badge" aria-label="Aktif bildirim"></span>
        </div>
      </button>
    </header>

    <!-- 1.5 DESKTOP TOP NAVIGATION (Visible on Desktop >= 768px, Hidden on Mobile) -->
    <nav class="desktop-nav-bar" aria-label="Masaüstü Gezinme Menüsü">
      <button type="button" class="desktop-nav-btn nav-btn active" data-view="home">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>Kontrol Merkezi</span>
      </button>
      <button type="button" class="desktop-nav-btn nav-btn" data-view="daily">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="4" width="18" height="18" rx="3" ry="3"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <span>Günün Çalışması</span>
      </button>
      <button type="button" class="desktop-nav-btn nav-btn" data-view="flashcard">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="M7 15h10"/><path d="M7 9h6"/></svg>
        <span>Flashcard</span>
      </button>
      <button type="button" class="desktop-nav-btn nav-btn" data-view="quiz">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        <span>Quiz &amp; Test</span>
      </button>
      <button type="button" class="desktop-nav-btn nav-btn" data-view="directory">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/><path d="M6 6h10"/><path d="M6 10h10"/></svg>
        <span>Kelime Havuzu</span>
      </button>
      <button type="button" class="desktop-nav-btn nav-btn" data-view="stats">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        <span>İstatistik &amp; Analiz</span>
      </button>
    </nav>

    <!-- 2. HORIZONTAL SNAP-SCROLL SELECTOR (Müfredat Seçici) -->
    <section class="horizontal-scroll-selector" aria-label="Müfredat ve Kategori Seçimi">
      <div class="h-scroll-track" id="horizontal-module-track" role="tablist">
        
        <!-- Module 1: MEB (Tüm Sınıflar İçin Ana Çatı) -->
        <button type="button" class="h-category-btn module-btn active" data-module="maarif" id="mod-tab-maarif" onclick="window.APP.switchModule('maarif')" role="tab" aria-selected="true" title="MEB İngilizce Müfredatı (5. Sınıf Maarif Modeli)">
          <div class="h-cat-badge">MEB</div>
          <div class="h-cat-content">
            <span class="h-cat-title">MEB Müfredatı</span>
            <span class="h-cat-meta">5. Sınıf Maarif • 815 K</span>
          </div>
        </button>

        <!-- Module 2: YDS -->
        <button type="button" class="h-category-btn module-btn" data-module="yds" id="mod-tab-yds" onclick="window.APP.switchModule('yds')" role="tab" aria-selected="false">
          <div class="h-cat-badge">YDS</div>
          <div class="h-cat-content">
            <span class="h-cat-title">YDS / YÖKDİL</span>
            <span class="h-cat-meta">7.387 KELİME</span>
          </div>
        </button>

        <!-- Module 3: Oxford 5000 -->
        <button type="button" class="h-category-btn module-btn" data-module="oxford" id="mod-tab-oxford" onclick="window.APP.switchModule('oxford')" role="tab" aria-selected="false">
          <div class="h-cat-badge">OXF</div>
          <div class="h-cat-content">
            <span class="h-cat-title">Oxford 5000</span>
            <span class="h-cat-meta">4.886 KELİME</span>
          </div>
        </button>

        <!-- Module 4: All Library -->
        <button type="button" class="h-category-btn module-btn" data-module="all" id="mod-tab-all" onclick="window.APP.switchModule('all')" role="tab" aria-selected="false">
          <div class="h-cat-badge">ALL</div>
          <div class="h-cat-content">
            <span class="h-cat-title">Tüm Kütüphane</span>
            <span class="h-cat-meta">9.234 KELİME</span>
          </div>
        </button>

      </div>
    </section>

    <!-- 3. VIEWS CONTAINER (Single-Column Content) -->
    <main class="views-wrapper" id="views-wrapper" role="main">
      
      <!-- View 0: Kontrol Merkezi / Dashboard (#home) -->
      <section id="view-home" class="view-section active" aria-labelledby="tab-home">
        <!-- Rendered by app.js (Hero Feature Card + Bento Metrics + Secondary Feed Items) -->
      </section>

      <!-- View 1: Günlük Çalışma (#daily) -->
      <section id="view-daily" class="view-section" aria-labelledby="tab-daily">
        <!-- Rendered by app.js (Daily Hero Progress + Secondary Feed Word Cards) -->
      </section>

      <!-- View 2: Flashcard (#flashcard) -->
      <section id="view-flashcard" class="view-section" aria-labelledby="tab-flashcard">
        <!-- Rendered by app.js -->
      </section>

      <!-- View 3: Quiz & Test (#quiz) -->
      <section id="view-quiz" class="view-section" aria-labelledby="tab-quiz">
        <!-- Rendered by app.js -->
      </section>

      <!-- View 4: Kelime Havuzu (#directory) -->
      <section id="view-directory" class="view-section" aria-labelledby="tab-directory">
        <!-- Rendered by app.js -->
      </section>

      <!-- View 5: İstatistik (#stats) -->
      <section id="view-stats" class="view-section" aria-labelledby="tab-stats">
        <!-- Rendered by app.js -->
      </section>

    </main>

  </div>

  <!-- 4. FIXED FLOATING NAVIGATION BAR (Fixed pill, 64px, Center Cutout FAB) -->
  <nav class="floating-nav-bar" aria-label="Alt Gezinme Çubuğu">
    <!-- Item 1: Home -->
    <button type="button" class="floating-nav-btn nav-btn active" data-view="home" id="tab-home" aria-label="Kontrol Merkezi" title="Kontrol Merkezi">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span class="nav-dot"></span>
    </button>

    <!-- Item 2: Daily Workout -->
    <button type="button" class="floating-nav-btn nav-btn" data-view="daily" id="tab-daily" aria-label="Günün Çalışması" title="Günün Çalışması">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3" ry="3"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span class="nav-dot"></span>
    </button>

    <!-- Center Action: 56px Red Circle Button Floating 32px Above with 4px Cutout Border -->
    <div class="floating-fab-container">
      <button type="button" class="floating-center-action-btn" id="floating-center-fab" onclick="window.APP.handleFabAction()" aria-label="Çalışmayı Başlat" title="Çalışmayı Başlat">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 4 20 12 6 20 6 4"/></svg>
      </button>
    </div>

    <!-- Item 3: Flashcard -->
    <button type="button" class="floating-nav-btn nav-btn" data-view="flashcard" id="tab-flashcard" aria-label="Flashcard" title="Flashcard">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="M7 15h10"/><path d="M7 9h6"/></svg>
      <span class="nav-dot"></span>
    </button>

    <!-- Item 4: Quiz -->
    <button type="button" class="floating-nav-btn nav-btn" data-view="quiz" id="tab-quiz" aria-label="Quiz &amp; Test" title="Quiz &amp; Test">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      <span class="nav-dot"></span>
    </button>
  </nav>

  <!-- 5. SETTINGS & PROFILE DIALOG (Sophisticated Playful Modal) -->
  <div class="settings-modal-backdrop" id="settings-modal-backdrop" onclick="window.APP.closeSettingsModal()" aria-hidden="true"></div>
  <div class="settings-dialog-card" id="settings-dialog" role="dialog" aria-modal="true" aria-labelledby="settings-dialog-title">
    <div class="settings-dialog-header">
      <div class="settings-user-info">
        <div class="settings-avatar-circle">
          <img src="icon-192.png" alt="Learnish Profil" class="settings-avatar-img">
        </div>
        <div>
          <h2 id="settings-dialog-title" class="settings-name">Profil &amp; Ayarlar</h2>
          <p class="settings-subtitle">Learnish Öğrenim Parametreleri</p>
        </div>
      </div>
      <button type="button" class="settings-close-circle-btn" onclick="window.APP.closeSettingsModal()" aria-label="Pencereyi Kapat">✕</button>
    </div>

    <div class="settings-dialog-body">
      <!-- Quick Shortcuts -->
      <div class="settings-nav-shortcuts">
        <button type="button" class="settings-shortcut-btn" onclick="window.APP.switchViewAndClose('directory')">
          <span class="s-icon">📚</span>
          <div class="s-text">
            <strong>Kelime Havuzu &amp; Arama</strong>
            <span>9.234 kelimelik tam kütüphane</span>
          </div>
          <span class="s-arrow">→</span>
        </button>
        <button type="button" class="settings-shortcut-btn" onclick="window.APP.switchViewAndClose('stats')">
          <span class="s-icon">📊</span>
          <div class="s-text">
            <strong>İstatistik &amp; Analiz</strong>
            <span>Öğrenim telemetrisi ve kazanım analizi</span>
          </div>
          <span class="s-arrow">→</span>
        </button>
      </div>

      <!-- System Toggles -->
      <div class="settings-toggles-section">
        <div class="settings-section-title">SİSTEM TERCİHLERİ</div>
        <div class="settings-grid">
          
          <div class="setting-item-row">
            <div class="setting-item-label">
              <strong>Telaffuz Aksanı</strong>
              <span>İngiliz (UK) veya Amerikan (US)</span>
            </div>
            <button type="button" class="setting-pill-btn" id="accent-toggle-btn">UK</button>
          </div>

          <div class="setting-item-row">
            <div class="setting-item-label">
              <strong>Okuma Hızı</strong>
              <span>Telaffuz ses hızı çarpanı</span>
            </div>
            <button type="button" class="setting-pill-btn" id="speed-toggle-btn">1.0x</button>
          </div>

          <div class="setting-item-row">
            <div class="setting-item-label">
              <strong>Ses Efektleri</strong>
              <span>Etkileşim ve sınav bildirimleri</span>
            </div>
            <button type="button" class="setting-pill-btn" id="sound-toggle-btn">SES: AÇIK</button>
          </div>

          <div class="setting-item-row">
            <div class="setting-item-label">
              <strong>Karanlık Mod</strong>
              <span>Charcoal (#171e19) gece teması</span>
            </div>
            <button type="button" class="setting-pill-btn" id="theme-toggle-btn">TEMA: AÇIK</button>
          </div>

        </div>
      </div>
    </div>
  </div>

  <!-- 6. SPEAKING & PRONUNCIATION COACH DIALOG (Interactive Voice & Phonetic Engine) -->
  <div class="speech-coach-backdrop" id="speech-coach-backdrop" onclick="window.APP.closeSpeechCoach()" aria-hidden="true"></div>
  <div class="speech-coach-dialog" id="speech-coach-dialog" role="dialog" aria-modal="true" aria-labelledby="speech-coach-title">
    <!-- Populated dynamically by window.APP.openSpeechCoach -->
  </div>

  <!-- Data & Application Logic -->
  <script src="words-data.js?v=speaking1"></script>
  <script src="app.js?v=speaking1"></script>
</body>
</html>
