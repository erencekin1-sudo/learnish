<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Learnish • İngilizce Kelime Platformu (Maarif, YDS &amp; Oxford 5000)</title>
  
  <!-- Meta & SEO -->
  <meta name="description" content="Learnish: 5. Sınıf Maarif Modeli, YDS/YÖKDİL Akademik Hazırlık ve The Oxford 5000 (A1-C1) 6.658 kelimelik interaktif İngilizce kelime çalışma platformu.">
  <meta name="theme-color" content="#0b0d13">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Learnish">
  
  <!-- App Icons & Manifest -->
  <link rel="icon" type="image/png" href="favicon.png?v=codex2">
  <link rel="apple-touch-icon" href="icon-192.png?v=codex2">
  <link rel="manifest" href="manifest.json">
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="app.css?v=swiss2">
</head>
<body>

  <!-- Confetti Canvas for High Scores -->
  <canvas id="confetti-canvas" style="position:fixed; top:0; left:0; width:100vw; height:100vh; pointer-events:none; z-index:9999; display:none;"></canvas>

  <!-- 1. TOP MODULE SWITCHER BAR -->
  <div class="module-bar">
    <div class="module-bar-container">
      <div class="module-tabs" role="tablist" aria-label="Öğrenim Modülü Seçici">
        
        <button class="module-btn active" data-module="maarif" id="mod-tab-maarif" onclick="window.APP.switchModule('maarif')">
          <span class="mod-icon">🎓</span>
          <div class="mod-text-group">
            <span class="mod-title">5. Sınıf Maarif Modeli</span>
            <span class="mod-meta">8 Tema • 82 Gün • 817 Kelime</span>
          </div>
        </button>

        <button class="module-btn" data-module="yds" id="mod-tab-yds" onclick="window.APP.switchModule('yds')">
          <span class="mod-icon">🎯</span>
          <div class="mod-text-group">
            <span class="mod-title">YDS &amp; YÖKDİL Akademik</span>
            <span class="mod-meta">B2 / C1 Sınav Kelimeleri • 2.894 Kelime</span>
          </div>
        </button>

        <button class="module-btn" data-module="oxford" id="mod-tab-oxford" onclick="window.APP.switchModule('oxford')">
          <span class="mod-icon">🌍</span>
          <div class="mod-text-group">
            <span class="mod-title">The Oxford 5000</span>
            <span class="mod-meta">A1 - C1 Dünya Standardı • 5.841 Kelime</span>
          </div>
        </button>

        <button class="module-btn" data-module="all" id="mod-tab-all" onclick="window.APP.switchModule('all')">
          <span class="mod-icon">📚</span>
          <div class="mod-text-group">
            <span class="mod-title">Tüm Kütüphane</span>
            <span class="mod-meta">6.658 Kelime Birleşik Havuz</span>
          </div>
        </button>

      </div>
    </div>
  </div>

  <!-- 2. STICKY APP SUB-HEADER -->
  <header class="app-header">
    <div class="header-container">
      
      <!-- Brand & Home Group (Visible Home Indication for Touchscreens) -->
      <button type="button" class="brand-group-btn" onclick="window.APP.goHome()" aria-label="Learnish Ana Sayfasına Dön">
        <div class="brand-icon-wrapper">
          <img src="logo.svg?v=codex2" alt="Learnish Logo" class="brand-icon">
          <span class="brand-home-pill" aria-hidden="true">🏠 Ev</span>
        </div>
        <div class="brand-info">
          <h1>Learnish</h1>
          <p id="app-brand-subtitle">5. Sınıf Maarif Modeli • Günlük Görev: 10 Kelime</p>
        </div>
      </button>

      <!-- Prominent Home Action for Kids -->
      <button class="nav-home-btn" id="header-home-btn" onclick="window.APP.goHome()" title="Ana Sayfaya / Günün Çalışmasına Dön">
        <span class="home-icon">🏠</span>
        <span class="home-label">Ana Sayfa</span>
      </button>

      <!-- Navigation Tabs -->
      <nav class="nav-tabs" aria-label="Uygulama Modları">
        <button class="nav-btn active" data-view="daily" id="tab-daily">
          <span class="nav-btn-icon" id="tab-daily-icon">📅</span>
          <span id="tab-daily-text">Günün 10'lusu</span>
        </button>
        <button class="nav-btn" data-view="flashcard" id="tab-flashcard">
          <span class="nav-btn-icon">🗂️</span>
          <span id="tab-flashcard-text">Flashcard</span>
        </button>
        <button class="nav-btn" data-view="quiz" id="tab-quiz">
          <span class="nav-btn-icon">🧩</span>
          <span id="tab-quiz-text">Quiz &amp; Test</span>
        </button>
        <button class="nav-btn" data-view="directory" id="tab-directory">
          <span class="nav-btn-icon">📚</span>
          <span id="tab-directory-text">Kelime Havuzu</span>
        </button>
        <button class="nav-btn" data-view="stats" id="tab-stats">
          <span class="nav-btn-icon">📊</span>
          <span id="tab-stats-text">İstatistik</span>
        </button>
      </nav>

      <!-- Global Settings & Actions -->
      <div class="header-actions">
        <button class="ctrl-btn" id="accent-toggle-btn" title="İngilizce Telaffuz Aksanı (İngiliz / Amerikan)">
          🇬🇧 UK
        </button>
        <button class="ctrl-btn" id="speed-toggle-btn" title="Okuma Hızı">
          ⚡ 1.0x
        </button>
        <button class="ctrl-btn" id="sound-toggle-btn" title="Ses Efektleri">
          🔔 Ses Açık
        </button>
        <button class="ctrl-btn" id="theme-toggle-btn" title="Karanlık / Aydınlık Mod">
          ☀️ Açık
        </button>
      </div>

    </div>
  </header>

  <!-- 3. MAIN VIEWS CONTAINER -->
  <main class="main-wrapper">

    <!-- Active Navigation Breadcrumb & Back Navigator -->
    <nav class="breadcrumb-container" id="app-breadcrumb-nav" aria-label="Konum ve Geri Navigasyonu">
      <div class="breadcrumb-left">
        <button type="button" class="breadcrumb-back-btn" id="breadcrumb-back-btn" onclick="window.APP.goBack()" aria-label="Bir Önceki Sayfaya Dön" title="Bir Önceki Sayfaya Dön">
          <span class="back-arrow" aria-hidden="true">←</span>
          <span class="back-text">Geri Dön</span>
        </button>
        <ol class="breadcrumb-list" id="app-breadcrumb">
          <li class="breadcrumb-item">
            <button type="button" class="breadcrumb-home-chip" id="breadcrumb-module-btn" onclick="window.APP.goHome()" aria-label="Ana Sayfaya Dön" title="Ana Sayfaya Dön">
              <span class="chip-home-icon" aria-hidden="true">🏠</span>
              <span id="breadcrumb-module-text">🎓 5. Sınıf Maarif Modeli</span>
            </button>
          </li>
          <li class="breadcrumb-sep" aria-hidden="true">›</li>
          <li class="breadcrumb-item active" id="breadcrumb-view-label">📅 Günün 10'lusu</li>
        </ol>
      </div>
      <div class="breadcrumb-right" id="breadcrumb-context-badge">
        <div id="breadcrumb-dynamic-badge" class="badge-live-container">
          <!-- Dynamically populated with live Kahoot-style progress -->
        </div>
      </div>
    </nav>
    
    <!-- View 1: Günlük Çalışma / Workout -->
    <section id="view-daily" class="view-section active" aria-labelledby="tab-daily">
      <!-- Injected by app.js -->
    </section>

    <!-- View 2: 3D Flashcard Modu -->
    <section id="view-flashcard" class="view-section" aria-labelledby="tab-flashcard">
      <!-- Injected by app.js -->
    </section>

    <!-- View 3: Quiz & Test Modu -->
    <section id="view-quiz" class="view-section" aria-labelledby="tab-quiz">
      <!-- Injected by app.js -->
    </section>

    <!-- View 4: Kelime Havuzu & Arama -->
    <section id="view-directory" class="view-section" aria-labelledby="tab-directory">
      <!-- Injected by app.js -->
    </section>

    <!-- View 5: İstatistikler & Analiz -->
    <section id="view-stats" class="view-section" aria-labelledby="tab-stats">
      <!-- Injected by app.js -->
    </section>

  </main>

  <!-- Data & Application Logic -->
  <script src="words-data.js?v=817"></script>
  <script src="app.js?v=817"></script>
</body>
</html>
