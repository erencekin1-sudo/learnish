            <span class="mod-icon" aria-hidden="true">

              <span class="mod-meta">6.658 KELİME HAVUZU</span>

        <button type="button" class="nav-btn" data-view="quiz" id="tab-quiz">

            1.0x

    <!-- 2. MAIN WORKSPACE PLANE (.workspace-plane) -->
    <main class="workspace-plane main-wrapper">

      <!-- Active Navigation Breadcrumb & Back Navigator -->
      <nav class="breadcrumb-container" id="app-breadcrumb-nav" aria-label="Konum ve Geri Navigasyonu">
        <div class="breadcrumb-left">
          <button type="button" class="breadcrumb-back-btn" id="breadcrumb-back-btn" onclick="window.APP.goBack()" aria-label="Bir Önceki Sayfaya Dön" title="Bir Önceki Sayfaya Dön">

        </div>
      </nav>
      
      <!-- View 0: Kontrol Merkezi / IDE Dashboard (#home) -->
      <section id="view-home" class="view-section active" aria-labelledby="tab-home">
        <!-- Injected by app.js -->
      </section>

      <!-- View 1: Günlük Çalışma / Workout -->
      <section id="view-daily" class="view-section" aria-labelledby="tab-daily">
        <!-- Injected by app.js -->
      </section>

      <section id="view-flashcard" class="view-section" aria-labelledby="tab-flashcard">
        <!-- Injected by app.js -->
      </section>

      <!-- View 3: Quiz & Test Modu -->
      <section id="view-quiz" class="view-section" aria-labelledby="tab-quiz">
        <!-- Injected by app.js -->
      </section>

      <!-- View 4: Kelime Havuzu & Arama -->
      <section id="view-directory" class="view-section" aria-labelledby="tab-directory">
        <!-- Injected by app.js -->
      </section>

      <!-- View 5: İstatistikler & Analiz -->
      <section id="view-stats" class="view-section" aria-labelledby="tab-stats">

    </div>
    <div class="window-body">
      <p class="window-body-desc">Çalışmak istediğiniz hedef müfredat modülünü seçiniz:</p>
      <div class="window-module-list">
        <button type="button" class="window-item-btn active" data-mod-id="maarif" onclick="window.APP.switchModuleAndClose('maarif')">
          <span class="w-item-icon">🎓</span>
          <div class="w-item-info">
            <span class="w-item-title">5. Sınıf Maarif Modeli</span>

            <span class="w-item-title">YDS &amp; YÖKDİL Akademik</span>

          <span class="w-item-arrow">→</span>

        <button type="button" class="window-item-btn" data-mod-id="oxford" onclick="window.APP.switchModuleAndClose('oxford')">
          <span class="w-item-icon">📖</span>

            <span class="w-item-title">The Oxford 5000</span>
            <span class="w-item-meta">A1–C1 SEVİYELER • 5.841 KELİME</span>

          <span class="w-item-arrow">→</span>

        <button type="button" class="window-item-btn" data-mod-id="all" onclick="window.APP.switchModuleAndClose('all')">
