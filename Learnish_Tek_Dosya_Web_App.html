/* ==========================================================================
   5. SINIF İNGİLİZCE KELİME DÜNYASI (MAARİF MODELİ & CEFR)
   Tasarım Sistemi: Modern Glassmorphic, Fluid Typography & Vibrant Hues
   ========================================================================== */

@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

:root {
  /* Color Palette - Dark Premium (Default) */
  --bg-primary: #090d16;
  --bg-secondary: #0f172a;
  --bg-card: rgba(30, 41, 59, 0.72);
  --bg-card-hover: rgba(51, 65, 85, 0.85);
  --border-subtle: rgba(255, 255, 255, 0.08);
  --border-focus: rgba(99, 102, 241, 0.6);
  --text-main: #f8fafc;
  --text-muted: #94a3b8;
  --text-dim: #64748b;
  
  /* Brand Accents */
  --primary: #6366f1;
  --primary-glow: rgba(99, 102, 241, 0.35);
  --primary-light: #818cf8;
  --accent-cyan: #06b6d4;
  --accent-purple: #8b5cf6;
  --accent-pink: #ec4899;
  --accent-emerald: #10b981;
  --accent-amber: #f59e0b;
  --accent-rose: #f43f5e;

  /* CEFR Colors */
  --cefr-a1-bg: rgba(16, 185, 129, 0.15);
  --cefr-a1-text: #34d399;
  --cefr-a1-border: rgba(16, 185, 129, 0.4);

  --cefr-a2-bg: rgba(6, 182, 212, 0.15);
  --cefr-a2-text: #22d3ee;
  --cefr-a2-border: rgba(6, 182, 212, 0.4);

  --cefr-b1-bg: rgba(59, 130, 246, 0.15);
  --cefr-b1-text: #60a5fa;
  --cefr-b1-border: rgba(59, 130, 246, 0.4);

  --cefr-b2-bg: rgba(139, 92, 246, 0.15);
  --cefr-b2-text: #a78bfa;
  --cefr-b2-border: rgba(139, 92, 246, 0.4);

  --cefr-c1-bg: rgba(245, 158, 11, 0.15);
  --cefr-c1-text: #fbbf24;
  --cefr-c1-border: rgba(245, 158, 11, 0.4);

  --cefr-c2-bg: rgba(244, 63, 94, 0.15);
  --cefr-c2-text: #fb7185;
  --cefr-c2-border: rgba(244, 63, 94, 0.4);

  /* Typography */
  --font-heading: 'Outfit', -apple-system, sans-serif;
  --font-body: 'Plus Jakarta Sans', -apple-system, sans-serif;

  /* Effects */
  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --radius-xl: 28px;
  --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.2);
  --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.35);
  --shadow-glow: 0 0 35px var(--primary-glow);
  --transition-fast: 0.18s cubic-bezier(0.16, 1, 0.3, 1);
  --transition-smooth: 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  --transition-bounce: 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
}

/* Light Theme Variables */
[data-theme="light"] {
  --bg-primary: #f8fafc;
  --bg-secondary: #f1f5f9;
  --bg-card: rgba(255, 255, 255, 0.9);
  --bg-card-hover: #ffffff;
  --border-subtle: rgba(148, 163, 184, 0.25);
  --border-focus: rgba(99, 102, 241, 0.8);
  --text-main: #0f172a;
  --text-muted: #475569;
  --text-dim: #94a3b8;
  --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.05);
  --shadow-md: 0 10px 30px rgba(15, 23, 42, 0.08);

  --cefr-a1-bg: #ecfdf5;
  --cefr-a1-text: #059669;
  --cefr-a1-border: #a7f3d0;

  --cefr-a2-bg: #ecfeff;
  --cefr-a2-text: #0891b2;
  --cefr-a2-border: #a5f3fc;

  --cefr-b1-bg: #eff6ff;
  --cefr-b1-text: #2563eb;
  --cefr-b1-border: #bfdbfe;

  --cefr-b2-bg: #f5f3ff;
  --cefr-b2-text: #7c3aed;
  --cefr-b2-border: #ddd6fe;

  --cefr-c1-bg: #fffbeb;
  --cefr-c1-text: #d97706;
  --cefr-c1-border: #fde68a;

  --cefr-c2-bg: #fff1f2;
  --cefr-c2-text: #e11d48;
  --cefr-c2-border: #fecdd3;
}

/* Base Styles */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

body {
  font-family: var(--font-body);
  background-color: var(--bg-primary);
  color: var(--text-main);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
  line-height: 1.5;
  background-image: 
    radial-gradient(circle at 15% 15%, rgba(99, 102, 241, 0.12) 0%, transparent 40%),
    radial-gradient(circle at 85% 85%, rgba(139, 92, 246, 0.08) 0%, transparent 45%);
  background-attachment: fixed;
}

/* Glass Surface Utility */
.glass-panel {
  background: var(--bg-card);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-md);
}

/* ==========================================================================
   Header & Navigation
   ========================================================================== */
.app-header {
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(9, 13, 22, 0.82);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border-bottom: 1px solid var(--border-subtle);
  padding: 12px 24px;
}

[data-theme="light"] .app-header {
  background: rgba(248, 250, 252, 0.85);
}

.header-container {
  max-width: 1280px;
  margin: 0 auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
}

.brand-group {
  display: flex;
  align-items: center;
  gap: 12px;
  text-decoration: none;
  cursor: pointer;
}

.brand-icon {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  box-shadow: 0 4px 14px var(--primary-glow);
  object-fit: cover;
}

.brand-info h1 {
  font-family: var(--font-heading);
  font-size: 1.22rem;
  font-weight: 800;
  letter-spacing: -0.3px;
  background: linear-gradient(135deg, #ffffff 30%, var(--primary-light) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

[data-theme="light"] .brand-info h1 {
  background: linear-gradient(135deg, #0f172a 30%, var(--primary) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.brand-info p {
  font-size: 0.76rem;
  color: var(--text-muted);
  font-weight: 600;
  letter-spacing: 0.4px;
}

/* Nav Tabs */
.nav-tabs {
  display: flex;
  background: rgba(15, 23, 42, 0.6);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-xl);
  padding: 4px;
  gap: 4px;
}

[data-theme="light"] .nav-tabs {
  background: rgba(226, 232, 240, 0.7);
}

.nav-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 16px;
  border-radius: 20px;
  border: none;
  background: transparent;
  color: var(--text-muted);
  font-family: var(--font-body);
  font-size: 0.88rem;
  font-weight: 700;
  cursor: pointer;
  transition: var(--transition-fast);
}

.nav-btn:hover {
  color: var(--text-main);
  background: rgba(255, 255, 255, 0.05);
}

.nav-btn.active {
  background: var(--primary);
  color: #ffffff;
  box-shadow: 0 4px 14px var(--primary-glow);
}

.nav-btn-icon {
  font-size: 1.05rem;
}

/* Header Action Controls */
.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.ctrl-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 38px;
  padding: 0 12px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-subtle);
  background: var(--bg-card);
  color: var(--text-main);
  font-family: var(--font-body);
  font-size: 0.82rem;
  font-weight: 700;
  cursor: pointer;
  transition: var(--transition-fast);
  gap: 6px;
}

.ctrl-btn:hover {
  background: var(--bg-card-hover);
  border-color: var(--primary-light);
  transform: translateY(-1px);
}

.ctrl-btn:active {
  transform: translateY(0);
}

/* ==========================================================================
   Main Content Layout
   ========================================================================== */
.main-wrapper {
  max-width: 1280px;
  margin: 0 auto;
  padding: 24px;
  width: 100%;
  flex: 1;
}

.view-section {
  display: none;
  animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

.view-section.active {
  display: block;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ==========================================================================
   VIEW 1: Günün 10'lusu (Daily Workout)
   ========================================================================== */
.daily-banner {
  padding: 24px 28px;
  margin-bottom: 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 16px;
  background: linear-gradient(135deg, rgba(30, 27, 75, 0.9) 0%, rgba(49, 46, 129, 0.85) 100%);
  border: 1px solid rgba(129, 140, 248, 0.3);
}

[data-theme="light"] .daily-banner {
  background: linear-gradient(135deg, #eef2ff 0%, #e0e7ff 100%);
  border-color: #c7d2fe;
}

.daily-banner-text h2 {
  font-family: var(--font-heading);
  font-size: 1.55rem;
  font-weight: 800;
  margin-bottom: 4px;
  color: #ffffff;
}

[data-theme="light"] .daily-banner-text h2 {
  color: #1e1b4b;
}

.daily-banner-text p {
  font-size: 0.9rem;
  color: #c7d2fe;
}

[data-theme="light"] .daily-banner-text p {
  color: #4338ca;
}

.day-picker-control {
  display: flex;
  align-items: center;
  gap: 10px;
  background: rgba(15, 23, 42, 0.6);
  padding: 6px 12px;
  border-radius: var(--radius-xl);
  border: 1px solid rgba(255, 255, 255, 0.12);
}

[data-theme="light"] .day-picker-control {
  background: #ffffff;
  border-color: #cbd5e1;
}

.day-step-btn {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: none;
  background: var(--primary);
  color: #ffffff;
  font-weight: 800;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: var(--transition-fast);
}

.day-step-btn:hover:not(:disabled) {
  transform: scale(1.1);
  box-shadow: 0 0 10px var(--primary-glow);
}

.day-step-btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.day-select-input {
  background: transparent;
  border: none;
  color: var(--text-main);
  font-family: var(--font-heading);
  font-size: 1.05rem;
  font-weight: 800;
  cursor: pointer;
  padding: 2px 6px;
  outline: none;
}

.daily-progress-box {
  margin-bottom: 24px;
  padding: 16px 20px;
}

.progress-header {
  display: flex;
  justify-content: space-between;
  font-size: 0.85rem;
  font-weight: 700;
  margin-bottom: 8px;
}

.progress-track {
  width: 100%;
  height: 9px;
  background: rgba(148, 163, 184, 0.2);
  border-radius: 6px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent-cyan), var(--primary));
  border-radius: 6px;
  transition: width 0.4s ease;
}

/* Daily Word Cards Grid */
.words-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
  gap: 16px;
}

.word-card {
  padding: 18px 20px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  transition: var(--transition-smooth);
  position: relative;
  overflow: hidden;
  border-left: 5px solid var(--primary);
}

.word-card:hover {
  transform: translateY(-3px);
  border-color: var(--primary-light);
  box-shadow: 0 12px 28px rgba(0, 0, 0, 0.3);
}

.card-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}

.card-tags {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

.cefr-pill {
  font-size: 0.68rem;
  font-weight: 800;
  padding: 2px 8px;
  border-radius: 12px;
  border: 1px solid;
  letter-spacing: 0.4px;
}

.theme-pill {
  font-size: 0.68rem;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 6px;
  background: rgba(148, 163, 184, 0.12);
  color: var(--text-muted);
}

.word-number {
  font-size: 0.72rem;
  font-weight: 700;
  color: var(--text-dim);
}

.card-body {
  margin-bottom: 14px;
}

.word-en-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 6px;
}

.word-en {
  font-family: var(--font-heading);
  font-size: 1.35rem;
  font-weight: 800;
  color: var(--text-main);
  letter-spacing: -0.2px;
}

.speak-btn {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: 1px solid var(--border-subtle);
  background: rgba(99, 102, 241, 0.12);
  color: var(--primary-light);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1rem;
  transition: var(--transition-fast);
}

.speak-btn:hover {
  background: var(--primary);
  color: #ffffff;
  transform: scale(1.12);
}

.speak-btn.speaking {
  animation: pulseSpeaking 0.8s infinite alternate;
}

@keyframes pulseSpeaking {
  from { transform: scale(1); box-shadow: 0 0 0 rgba(99, 102, 241, 0); }
  to { transform: scale(1.18); box-shadow: 0 0 16px rgba(99, 102, 241, 0.8); }
}

.word-tr {
  font-size: 0.96rem;
  font-weight: 600;
  color: var(--accent-emerald);
  display: flex;
  align-items: center;
  gap: 6px;
}

.word-pos {
  font-size: 0.75rem;
  color: var(--text-dim);
  margin-top: 4px;
}

.card-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 10px;
  border-top: 1px solid var(--border-subtle);
}

.status-badge-btn {
  background: transparent;
  border: 1px solid var(--border-subtle);
  padding: 4px 10px;
  border-radius: 14px;
  font-size: 0.72rem;
  font-weight: 700;
  color: var(--text-muted);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 4px;
  transition: var(--transition-fast);
}

.status-badge-btn:hover {
  background: var(--bg-card-hover);
  color: var(--text-main);
}

.status-badge-btn.learned {
  background: rgba(16, 185, 129, 0.15);
  color: var(--accent-emerald);
  border-color: rgba(16, 185, 129, 0.4);
}

.status-badge-btn.review {
  background: rgba(245, 158, 11, 0.15);
  color: var(--accent-amber);
  border-color: rgba(245, 158, 11, 0.4);
}

.card-action-bar {
  display: flex;
  gap: 6px;
}

.star-btn {
  background: transparent;
  border: none;
  font-size: 1.15rem;
  color: var(--text-dim);
  cursor: pointer;
  transition: var(--transition-fast);
}

.star-btn:hover {
  transform: scale(1.2);
}

.star-btn.starred {
  color: var(--accent-amber);
}

/* ==========================================================================
   VIEW 2: 3D Flashcard Modu
   ========================================================================== */
.flashcard-wrapper {
  max-width: 680px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.flashcard-toolbar {
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 18px;
}

.filter-source-select {
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  color: var(--text-main);
  padding: 8px 14px;
  border-radius: var(--radius-md);
  font-family: var(--font-body);
  font-size: 0.88rem;
  font-weight: 700;
  outline: none;
  cursor: pointer;
}

.flashcard-counter {
  font-family: var(--font-heading);
  font-size: 1.1rem;
  font-weight: 800;
  color: var(--primary-light);
}

/* 3D Scene */
.card-scene {
  width: 100%;
  height: 380px;
  perspective: 1200px;
  margin-bottom: 22px;
  cursor: pointer;
}

.flashcard-inner {
  width: 100%;
  height: 100%;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.65s cubic-bezier(0.34, 1.56, 0.64, 1);
  border-radius: var(--radius-xl);
}

.flashcard-inner.flipped {
  transform: rotateY(180deg);
}

.card-face {
  position: absolute;
  width: 100%;
  height: 100%;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  border-radius: var(--radius-xl);
  padding: 36px 32px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
  border: 2px solid rgba(255, 255, 255, 0.1);
}

/* Front Face */
.card-face-front {
  background: linear-gradient(145deg, #1e1b4b 0%, #1e293b 60%, #0f172a 100%);
}

[data-theme="light"] .card-face-front {
  background: linear-gradient(145deg, #ffffff 0%, #f1f5f9 100%);
  border-color: #cbd5e1;
}

.card-face-back {
  background: linear-gradient(145deg, #064e3b 0%, #0f172a 60%, #022c22 100%);
  transform: rotateY(180deg);
}

[data-theme="light"] .card-face-back {
  background: linear-gradient(145deg, #f0fdf4 0%, #dcfce7 100%);
  border-color: #86efac;
}

.fc-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.fc-badges {
  display: flex;
  gap: 8px;
  align-items: center;
}

.fc-main {
  text-align: center;
  margin: auto 0;
}

.fc-word-en {
  font-family: var(--font-heading);
  font-size: 2.8rem;
  font-weight: 900;
  letter-spacing: -0.5px;
  color: #ffffff;
  margin-bottom: 12px;
  text-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
}

[data-theme="light"] .fc-word-en {
  color: #0f172a;
}

.fc-word-tr {
  font-family: var(--font-heading);
  font-size: 2.1rem;
  font-weight: 800;
  color: #34d399;
  margin-bottom: 10px;
}

[data-theme="light"] .fc-word-tr {
  color: #059669;
}

.fc-category-desc {
  font-size: 1rem;
  color: var(--text-muted);
  font-weight: 600;
}

.fc-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 0.8rem;
  color: var(--text-dim);
}

.fc-hint {
  display: flex;
  align-items: center;
  gap: 6px;
  opacity: 0.8;
}

/* Flashcard Controls */
.fc-controls {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 20px;
}

.fc-btn {
  padding: 12px 24px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-subtle);
  background: var(--bg-card);
  color: var(--text-main);
  font-family: var(--font-heading);
  font-size: 1rem;
  font-weight: 800;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: var(--transition-fast);
}

.fc-btn:hover {
  background: var(--primary);
  color: #ffffff;
  border-color: var(--primary);
  transform: translateY(-2px);
  box-shadow: 0 6px 18px var(--primary-glow);
}

.fc-btn.learned-btn {
  background: rgba(16, 185, 129, 0.2);
  border-color: rgba(16, 185, 129, 0.4);
  color: var(--accent-emerald);
}

.fc-btn.learned-btn:hover {
  background: var(--accent-emerald);
  color: #ffffff;
}

.fc-btn.review-btn {
  background: rgba(245, 158, 11, 0.2);
  border-color: rgba(245, 158, 11, 0.4);
  color: var(--accent-amber);
}

.fc-btn.review-btn:hover {

  border-radius: 4px;
  font-family: monospace;
  font-weight: 700;
  color: var(--text-muted);
}

/* ==========================================================================

   ========================================================================== */
.quiz-wrapper {
  max-width: 680px;
  margin: 0 auto;
}

.quiz-setup-card {
  padding: 32px 36px;
  text-align: center;
}

.quiz-setup-card h2 {
  font-family: var(--font-heading);
  font-size: 1.8rem;
  font-weight: 800;
  margin-bottom: 8px;
}

.quiz-setup-card p {
  color: var(--text-muted);
  margin-bottom: 24px;
}

.quiz-config-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-bottom: 28px;
  text-align: left;
}

.config-group label {
  display: block;
  font-size: 0.8rem;
  font-weight: 800;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 8px;
  letter-spacing: 0.5px;
}

.config-group select {
  width: 100%;
  padding: 10px 14px;
  border-radius: var(--radius-md);
  background: var(--bg-primary);
  border: 1px solid var(--border-subtle);
  color: var(--text-main);
  font-family: var(--font-body);
  font-size: 0.92rem;
  font-weight: 700;
  outline: none;
}

.start-quiz-btn {
  padding: 14px 36px;
  font-size: 1.1rem;
  font-family: var(--font-heading);
  font-weight: 800;
  border-radius: var(--radius-xl);
  border: none;
  background: linear-gradient(135deg, var(--primary) 0%, var(--accent-purple) 100%);
  color: #ffffff;
  cursor: pointer;
  box-shadow: 0 8px 24px var(--primary-glow);
  transition: var(--transition-bounce);
}

.start-quiz-btn:hover {
  transform: scale(1.05);
  box-shadow: 0 12px 30px rgba(99, 102, 241, 0.6);
}

/* Active Quiz Container */
.quiz-active-card {
  padding: 28px 32px;
}

.quiz-top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}

.quiz-streak-pill {
  font-size: 0.84rem;
  font-weight: 800;
  background: rgba(245, 158, 11, 0.18);
  color: var(--accent-amber);
  border: 1px solid rgba(245, 158, 11, 0.4);
  padding: 4px 12px;
  border-radius: 20px;
}

.quiz-progress-num {
  font-size: 0.84rem;
  font-weight: 700;
  color: var(--text-dim);
}

.quiz-question-box {
  background: rgba(15, 23, 42, 0.5);
  border-radius: var(--radius-lg);
  padding: 24px;
  margin-bottom: 24px;
  text-align: center;
  border: 1px solid var(--border-subtle);
}

[data-theme="light"] .quiz-question-box {
  background: #f1f5f9;
}

.quiz-prompt-label {
  font-size: 0.78rem;
  font-weight: 800;
  text-transform: uppercase;
  color: var(--primary-light);
  margin-bottom: 6px;
  letter-spacing: 1px;
}

.quiz-question-text {
  font-family: var(--font-heading);
  font-size: 2.2rem;
  font-weight: 900;
  color: var(--text-main);
  margin-bottom: 8px;
}

.quiz-options-list {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
  margin-bottom: 20px;
}

.quiz-opt-btn {
  padding: 16px 20px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-subtle);
  background: var(--bg-card);
  color: var(--text-main);
  font-family: var(--font-body);
  font-size: 1.05rem;
  font-weight: 700;
  cursor: pointer;
  text-align: left;
  display: flex;
  align-items: center;
  justify-content: space-between;
  transition: var(--transition-fast);
}

.quiz-opt-btn:hover:not(:disabled) {
  background: var(--bg-card-hover);
  border-color: var(--primary-light);
  transform: translateX(4px);
}

.quiz-opt-btn.correct {
  background: rgba(16, 185, 129, 0.25) !important;
  border-color: var(--accent-emerald) !important;
  color: #34d399 !important;
  animation: correctBounce 0.4s ease;
}

.quiz-opt-btn.wrong {
  background: rgba(244, 63, 94, 0.25) !important;
  border-color: var(--accent-rose) !important;
  color: #fb7185 !important;
  animation: shake 0.4s ease;
}

@keyframes correctBounce {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.02); }
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  75% { transform: translateX(6px); }
}

/* Quiz Results Card */
.quiz-results-card {
  padding: 36px 32px;
  text-align: center;
}

.results-score-circle {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--primary) 0%, var(--accent-purple) 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  margin: 0 auto 20px auto;
  box-shadow: 0 10px 30px var(--primary-glow);
}

.results-score-num {
  font-family: var(--font-heading);
  font-size: 2.2rem;
  font-weight: 900;
  color: #ffffff;
  line-height: 1;
}

.results-score-label {
  font-size: 0.72rem;
  color: #c7d2fe;
  font-weight: 700;
}

/* ==========================================================================
   VIEW 4: Kelime Bankası (Directory & Filters)
   ========================================================================== */
.directory-controls {
  padding: 20px 24px;
  margin-bottom: 24px;
}

.search-input-box {
  position: relative;
  margin-bottom: 16px;
}

.search-input {
  width: 100%;
  padding: 14px 18px 14px 44px;
  border-radius: var(--radius-xl);
  border: 1px solid var(--border-subtle);
  background: var(--bg-primary);
  color: var(--text-main);
  font-family: var(--font-body);
  font-size: 1rem;
  outline: none;
  transition: var(--transition-fast);
}

.search-input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 16px var(--primary-glow);
}

.search-icon {
  position: absolute;
  left: 16px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-dim);
  font-size: 1.1rem;
}

.filter-chips-group {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 12px;
}

.filter-chip {
  padding: 6px 14px;
  border-radius: 20px;
  border: 1px solid var(--border-subtle);
  background: transparent;
  color: var(--text-muted);
  font-family: var(--font-body);
  font-size: 0.78rem;
  font-weight: 700;
  cursor: pointer;
  transition: var(--transition-fast);
}

.filter-chip:hover {
  background: rgba(255, 255, 255, 0.06);
  color: var(--text-main);
}

.filter-chip.active {
  background: var(--primary);
  color: #ffffff;
  border-color: var(--primary);
  box-shadow: 0 2px 10px var(--primary-glow);
}

.dir-results-info {
  font-size: 0.85rem;
  color: var(--text-dim);
  font-weight: 600;
  padding-top: 6px;
}

/* ==========================================================================
   VIEW 5: İstatistikler & Maarif Kazanım Tablosu
   ========================================================================== */
.stats-summary-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}

.stat-metric-card {
  padding: 20px;
  text-align: center;
}

.metric-val {
  font-family: var(--font-heading);
  font-size: 2.4rem;
  font-weight: 900;
  line-height: 1.1;
  margin-bottom: 4px;
}

.metric-title {
  font-size: 0.82rem;
  font-weight: 700;
  color: var(--text-muted);
}

.themes-breakdown-card {
  padding: 24px;
}

.theme-stat-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid var(--border-subtle);
}

.theme-stat-name {
  font-weight: 700;
  font-size: 0.9rem;
}

.theme-stat-bar-container {
  flex: 1;
  max-width: 280px;
  margin: 0 16px;
  height: 8px;
  background: rgba(148, 163, 184, 0.15);
  border-radius: 4px;
  overflow: hidden;
}

/* ==========================================================================
   Confetti Canvas
   ========================================================================== */
#confetti-canvas {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  pointer-events: none;
  z-index: 9999;
}

/* ==========================================================================

@media (max-width: 768px) {

<script>
/**
 * ============================================================================
 * 5. SINIF İNGİLİZCE KELİME DÜNYASI (MAARİF MODELİ & CEFR)
 * Ana Uygulama Mantığı: Web Speech API, Web Audio API, PWA, Quiz & Flashcard
 * ============================================================================
 */

(function () {
  'use strict';

  // State Management
  const STATE = {
    currentView: 'daily', // 'daily', 'flashcard', 'quiz', 'directory', 'stats'
    currentDay: 1, // 1 to 51
    activeFlashcardIndex: 0,
    filteredFlashcards: [],
    flashcardFlipped: false,
    quizState: {
      active: false,
      questions: [],
      currentIndex: 0,
      score: 0,
      streak: 0,
      mode: 'en-tr', // 'en-tr', 'tr-en', 'listening'
      source: 'daily', // 'daily', 'all', 'review'
      answered: false
    },
    directoryFilters: {
      search: '',
      theme: 'all',
      cefr: 'all',
      status: 'all' // 'all', 'learned', 'review', 'starred'
    },
    settings: {
      accent: localStorage.getItem('mk_accent') || 'en-GB', // 'en-GB' or 'en-US'
      speed: parseFloat(localStorage.getItem('mk_speed') || '1.0'),
      soundEffects: localStorage.getItem('mk_sound') !== 'false',
      theme: localStorage.getItem('mk_theme') || 'dark'
    },
    userData: {
      learned: new Set(JSON.parse(localStorage.getItem('mk_learned') || '[]')),
      review: new Set(JSON.parse(localStorage.getItem('mk_review') || '[]')),
      starred: new Set(JSON.parse(localStorage.getItem('mk_starred') || '[]')),
      stats: JSON.parse(localStorage.getItem('mk_stats') || '{"quizzesPlayed":0,"correctAnswers":0,"totalQuestions":0,"bestStreak":0}')
    }
  };

  // Ensure current day is restored or defaults to 1
  const savedDay = parseInt(localStorage.getItem('mk_current_day'), 10);
  if (savedDay && savedDay >= 1 && savedDay <= 51) {
    STATE.currentDay = savedDay;
  }

  // ==========================================================================
  // Web Audio API Synthesizer (Zero external audio files needed)
  // ==========================================================================
  let audioCtx = null;

  function initAudioContext() {
    if (!audioCtx) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (AudioContext) {
        audioCtx = new AudioContext();
      }
    }
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  function playSound(type) {
    if (!STATE.settings.soundEffects) return;
    try {
      initAudioContext();
      if (!audioCtx) return;

      const now = audioCtx.currentTime;

      if (type === 'correct') {
        // Melodic major chord (E5, G#5, B5)
        const notes = [659.25, 830.61, 987.77];
        notes.forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now + idx * 0.07);
          gain.gain.setValueAtTime(0.18, now + idx * 0.07);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.07 + 0.35);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + idx * 0.07);
          osc.stop(now + idx * 0.07 + 0.35);
        });
      } else if (type === 'wrong') {
        // Subtle descending buzz
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(240, now);
        osc.frequency.linearRampToValueAtTime(140, now + 0.28);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.28);
      } else if (type === 'flip') {
        // Soft click
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(480, now);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.08);
      }
    } catch (e) {
      console.warn('Audio synthesis error:', e);
    }
  }

  // ==========================================================================
  // Web Speech API (English Voice Pronunciation)
  // ==========================================================================
  let availableVoices = [];

  function loadVoices() {
    if ('speechSynthesis' in window) {
      availableVoices = window.speechSynthesis.getVoices();
    }
  }

  if ('speechSynthesis' in window) {
    loadVoices();
    window.speechSynthesis.onvoiceschanged = loadVoices;
  }

  function speakWord(text, onComplete) {
    if (!('speechSynthesis' in window)) {
      alert('Tarayıcınız sesli telaffuzu desteklemiyor.');
      return;
    }

    initAudioContext();
    window.speechSynthesis.cancel(); // Stop prior speech

    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = STATE.settings.accent;
    utterance.rate = STATE.settings.speed;

    // Pick best matching voice
    if (availableVoices.length > 0) {
      const preferred = availableVoices.find(v => 
        v.lang.startsWith(STATE.settings.accent.slice(0, 2)) && 
        (v.name.includes('Google') || v.name.includes('Natural') || v.name.includes('Siri') || v.name.includes('Daniel') || v.name.includes('Samantha'))
      ) || availableVoices.find(v => v.lang.startsWith(STATE.settings.accent.slice(0, 2)));

      if (preferred) utterance.voice = preferred;
    }

    if (onComplete) {
      utterance.onend = onComplete;
      utterance.onerror = onComplete;
    }

    window.speechSynthesis.speak(utterance);
  }

  // ==========================================================================
  // Persistence Utilities
  // ==========================================================================
  function saveUserData() {
    localStorage.setItem('mk_learned', JSON.stringify(Array.from(STATE.userData.learned)));
    localStorage.setItem('mk_review', JSON.stringify(Array.from(STATE.userData.review)));
    localStorage.setItem('mk_starred', JSON.stringify(Array.from(STATE.userData.starred)));
    localStorage.setItem('mk_stats', JSON.stringify(STATE.userData.stats));
    localStorage.setItem('mk_current_day', STATE.currentDay.toString());
  }

  function toggleLearned(wordId) {
    wordId = parseInt(wordId, 10);
    if (STATE.userData.learned.has(wordId)) {
      STATE.userData.learned.delete(wordId);
    } else {
      STATE.userData.learned.add(wordId);
      STATE.userData.review.delete(wordId);
      playSound('correct');
    }
    saveUserData();
    updateUI();
  }

  function toggleReview(wordId) {
    wordId = parseInt(wordId, 10);
    if (STATE.userData.review.has(wordId)) {
      STATE.userData.review.delete(wordId);
    } else {
      STATE.userData.review.add(wordId);
      STATE.userData.learned.delete(wordId);
    }
    saveUserData();
    updateUI();
  }

  function toggleStarred(wordId) {
    wordId = parseInt(wordId, 10);
    if (STATE.userData.starred.has(wordId)) {
      STATE.userData.starred.delete(wordId);
    } else {
      STATE.userData.starred.add(wordId);
    }
    saveUserData();
    updateUI();
  }

  // ==========================================================================
  // Helper Formatters
  // ==========================================================================
  function getCefrBadgeHtml(level) {
    const cls = `cefr-${(level || 'a1').toLowerCase()}`;
    return `<span class="cefr-pill ${cls}" style="background: var(--${cls}-bg); color: var(--${cls}-text); border-color: var(--${cls}-border);">${level}</span>`;
  }

  function getThemeBadgeHtml(themeCode, themeTitle) {
    return `<span class="theme-pill">${themeCode} • ${themeTitle}</span>`;
  }

  // ==========================================================================
  // VIEW RENDERERS
  // ==========================================================================

  // 1. GÜNÜN 10'LUSU (DAILY WORKOUT)
  function renderDailyView() {
    const container = document.getElementById('view-daily');
    if (!container) return;

    const dayWords = WORDS_DATA.filter(w => w.day === STATE.currentDay);
    const dayLearnedCount = dayWords.filter(w => STATE.userData.learned.has(w.id)).length;
    const dayPercent = Math.round((dayLearnedCount / (dayWords.length || 10)) * 100);

    // Build Day select options
    let dayOptionsHtml = '';
    for (let d = 1; d <= 51; d++) {
      dayOptionsHtml += `<option value="${d}" ${d === STATE.currentDay ? 'selected' : ''}>Gün ${d} / 51</option>`;
    }

    let cardsHtml = '';
    dayWords.forEach(w => {
      const isLearned = STATE.userData.learned.has(w.id);
      const isReview = STATE.userData.review.has(w.id);
      const isStarred = STATE.userData.starred.has(w.id);

      cardsHtml += `
        <div class="word-card glass-panel" data-id="${w.id}">
          <div class="card-top">
            <div class="card-tags">
              ${getCefrBadgeHtml(w.cefr)}
              ${getThemeBadgeHtml(w.themeCode, w.themeTitle)}
            </div>
            <span class="word-number">#${w.no}</span>
          </div>

          <div class="card-body">
            <div class="word-en-row">
              <span class="word-en">${w.en}</span>
              <button class="speak-btn" data-word="${w.en}" title="Dinle (${STATE.settings.accent})">
                🔊
              </button>
            </div>
            <div class="word-tr">
              <span style="display:inline-block; font-size:10px; font-weight:800; padding:2px 5px; border-radius:4px; background:var(--cefr-a1-bg); color:var(--accent-emerald);">TR</span>
              ${w.tr}
            </div>
            <div class="word-pos">${w.desc} • ${w.cat}</div>
          </div>

          <div class="card-footer">
            <div class="card-action-bar">
              <button class="status-badge-btn ${isLearned ? 'learned' : ''}" onclick="window.APP.toggleLearned(${w.id})">
                ${isLearned ? '✅ Öğrendim' : 'Öğren'}
              </button>
              <button class="status-badge-btn ${isReview ? 'review' : ''}" onclick="window.APP.toggleReview(${w.id})">
                ${isReview ? '🔄 Tekrar Et' : 'Zor'}
              </button>
            </div>
            <button class="star-btn ${isStarred ? 'starred' : ''}" onclick="window.APP.toggleStarred(${w.id})" title="Favorilere Ekle">
              ${isStarred ? '★' : '☆'}
            </button>
          </div>
        </div>
      `;
    });

    container.innerHTML = `
      <div class="daily-banner glass-panel">
        <div class="daily-banner-text">
          <h2>📅 Gün ${STATE.currentDay} Kelimeleri</h2>
          <p>Bugün üzerinde çalışacağınız <strong>10 hedef kelime</strong> (Sıra: ${(STATE.currentDay - 1) * 10 + 1} – ${Math.min(STATE.currentDay * 10, WORDS_DATA.length)} / 506)</p>
        </div>
        <div class="day-picker-control">
          <button class="day-step-btn" id="prev-day-btn" ${STATE.currentDay <= 1 ? 'disabled' : ''}>&larr;</button>
          <select class="day-select-input" id="day-select-dropdown">
            ${dayOptionsHtml}
          </select>
          <button class="day-step-btn" id="next-day-btn" ${STATE.currentDay >= 51 ? 'disabled' : ''}>&rarr;</button>
        </div>
      </div>

      <div class="daily-progress-box glass-panel">
        <div class="progress-header">
          <span>Günün İlerlemesi: ${dayLearnedCount} / ${dayWords.length} Kelime</span>
          <span style="color: var(--accent-emerald);">%${dayPercent} Tamamlandı</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" style="width: ${dayPercent}%;"></div>
        </div>
        <div style="display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap;">
          <button class="fc-btn" style="padding: 8px 16px; font-size: 0.85rem;" onclick="window.APP.startDailyFlashcards()">
            🗂️ Bu Günün Kartlarıyla Çalış
          </button>
          <button class="fc-btn" style="padding: 8px 16px; font-size: 0.85rem;" onclick="window.APP.startDailyQuiz()">
            🧩 Bu Günün Mini Testini Çöz
          </button>
        </div>
      </div>

      <div class="words-grid">
        ${cardsHtml}
      </div>
    `;

    // Bind Day navigation
    document.getElementById('prev-day-btn')?.addEventListener('click', () => {
      if (STATE.currentDay > 1) {
        STATE.currentDay--;
        saveUserData();
        updateUI();
      }
    });

    document.getElementById('next-day-btn')?.addEventListener('click', () => {

  // 2. 3D FLASHCARD MODU
  function renderFlashcardView() {
    const container = document.getElementById('view-flashcard');
    if (!container) return;

    // Filter cards based on selected source
    const sourceSelect = document.getElementById('fc-source-select');
    const sourceVal = sourceSelect ? sourceSelect.value : (STATE.flashcardSource || 'daily');
    STATE.flashcardSource = sourceVal;

    let pool = [];
    if (sourceVal === 'daily') {
      pool = WORDS_DATA.filter(w => w.day === STATE.currentDay);
    } else if (sourceVal === 'review') {
      pool = WORDS_DATA.filter(w => STATE.userData.review.has(w.id));
    } else if (sourceVal === 'starred') {
      pool = WORDS_DATA.filter(w => STATE.userData.starred.has(w.id));
    } else if (sourceVal === 'learned') {
      pool = WORDS_DATA.filter(w => STATE.userData.learned.has(w.id));
    } else {
      pool = WORDS_DATA;
    }

    STATE.filteredFlashcards = pool;

    if (STATE.activeFlashcardIndex >= pool.length) {
      STATE.activeFlashcardIndex = Math.max(0, pool.length - 1);
    }

    if (pool.length === 0) {
      container.innerHTML = `

          <div class="flashcard-toolbar">

    if (qState.mode === 'listening') {

  function renderQuizResults(container) {
    const qState = STATE.quizState;
    const total = qState.questions.length;
    const correct = qState.score;
    const percent = Math.round((correct / (total || 1)) * 100);

    // Update global stats
    STATE.userData.stats.quizzesPlayed++;
    STATE.userData.stats.totalQuestions += total;
    STATE.userData.stats.correctAnswers += correct;
    if (qState.streak > STATE.userData.stats.bestStreak) {
      STATE.userData.stats.bestStreak = qState.streak;
    }
    saveUserData();

    // Trigger confetti if high score
    if (percent >= 80) {
      triggerConfetti();
    }

    container.innerHTML = `
      <div class="quiz-wrapper">
        <div class="quiz-results-card glass-panel">
          <div class="results-score-circle">
            <span class="results-score-num">%${percent}</span>
            <span class="results-score-label">${correct} / ${total} Doğru</span>
          </div>

          <h2 style="font-family: var(--font-heading); margin-bottom: 8px;">
            ${percent >= 80 ? '🎉 Harika Başarı!' : percent >= 50 ? '👏 Tebrikler, İyi Çalışma!' : '💪 Pratik Yapmaya Devam!'}
          </h2>
          <p style="color: var(--text-muted); margin-bottom: 24px;">
            ${percent >= 80 ? 'Kelimeleri gayet iyi kavramışsınız. Öğrenme seriniz güçleniyor!' : 'Zorlandığınız kelimeleri Flashcard üzerinden tekrar etmenizi öneririz.'}
          </p>

          <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
            <button class="fc-btn" onclick="window.APP.startQuiz()">🔄 Tekrar Çöz</button>
            <button class="fc-btn" style="background: var(--primary); color: #fff;" onclick="window.APP.switchView('flashcard')">🗂️ Kartlarla Çalış</button>
            <button class="ctrl-btn" onclick="window.APP.quitQuiz()">Ana Sayfaya Dön</button>
          </div>
        </div>
      </div>
    `;
  }

  // 4. KELİME BANKASI (DIRECTORY)
  function renderDirectoryView() {
    const container = document.getElementById('view-directory');
    if (!container) return;

    const filters = STATE.directoryFilters;

    let filtered = WORDS_DATA.filter(w => {
      // Search filter
      if (filters.search) {
        const query = filters.search.toLowerCase();
        const matchEn = w.en.toLowerCase().includes(query);
        const matchTr = w.tr.toLowerCase().includes(query);
        const matchCat = w.cat.toLowerCase().includes(query);
        if (!matchEn && !matchTr && !matchCat) return false;
      }

      // Theme filter
      if (filters.theme !== 'all' && w.themeNum !== parseInt(filters.theme, 10)) {
        return false;
      }

      // CEFR filter
      if (filters.cefr !== 'all' && w.cefr !== filters.cefr) {
        return false;
      }

      // Status filter
      if (filters.status === 'learned' && !STATE.userData.learned.has(w.id)) return false;
      if (filters.status === 'review' && !STATE.userData.review.has(w.id)) return false;
      if (filters.status === 'starred' && !STATE.userData.starred.has(w.id)) return false;

      return true;
    });

    let cardsHtml = '';
    filtered.slice(0, 100).forEach(w => {
      const isLearned = STATE.userData.learned.has(w.id);
      const isReview = STATE.userData.review.has(w.id);
      const isStarred = STATE.userData.starred.has(w.id);

      cardsHtml += `
        <div class="word-card glass-panel" data-id="${w.id}">
          <div class="card-top">

              ${getCefrBadgeHtml(w.cefr)}

        ${cardsHtml}

      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const word = btn.getAttribute('data-word');
        btn.classList.add('speaking');
        speakWord(word, () => btn.classList.remove('speaking'));
      });
    });
  }

  // 5. İSTATİSTİKLER (STATS & MASTERY)
  function renderStatsView() {
    const container = document.getElementById('view-stats');
    if (!container) return;

    const totalLearned = STATE.userData.learned.size;
    const totalReview = STATE.userData.review.size;
    const totalWords = WORDS_DATA.length;
    const progressPercent = Math.round((totalLearned / totalWords) * 100);

    const quizStats = STATE.userData.stats;
    const quizAccuracy = quizStats.totalQuestions > 0 ? Math.round((quizStats.correctAnswers / quizStats.totalQuestions) * 100) : 0;

    // Theme breakdown
    let themesBreakdownHtml = '';
    for (let t = 1; t <= 8; t++) {
      const tWords = WORDS_DATA.filter(w => w.themeNum === t);
      const tLearned = tWords.filter(w => STATE.userData.learned.has(w.id)).length;
      const tPct = Math.round((tLearned / (tWords.length || 1)) * 100);
      const tMeta = THEMES_DATA[t];

      themesBreakdownHtml += `
        <div class="theme-stat-row">
          <div style="width: 220px;">
            <div class="theme-stat-name">${tMeta.code}: ${tMeta.title}</div>
            <div style="font-size: 0.72rem; color: var(--text-dim);">${tMeta.titleTr}</div>
          </div>
          <div class="theme-stat-bar-container">
            <div style="height: 100%; width: ${tPct}%; background: ${tMeta.badgeBg}; border-radius: 4px;"></div>
          </div>
          <div style="font-size: 0.82rem; font-weight: 700; min-width: 80px; text-align: right;">
            ${tLearned} / ${tWords.length} (%${tPct})
          </div>
        </div>
      `;
    }

    container.innerHTML = `
      <div class="stats-summary-grid">
        <div class="stat-metric-card glass-panel">
          <div class="metric-val" style="color: var(--accent-emerald);">${totalLearned}</div>
          <div class="metric-title">Öğrenilen Kelimeler (%${progressPercent})</div>
        </div>
        <div class="stat-metric-card glass-panel">
          <div class="metric-val" style="color: var(--accent-amber);">${totalReview}</div>
          <div class="metric-title">Tekrar Listesi</div>
        </div>
        <div class="stat-metric-card glass-panel">
          <div class="metric-val" style="color: var(--primary-light);">${quizAccuracy}%</div>
          <div class="metric-title">Quiz Doğruluk Oranı</div>
        </div>
        <div class="stat-metric-card glass-panel">
          <div class="metric-val" style="color: var(--accent-cyan);">${quizStats.bestStreak}</div>
          <div class="metric-title">En Yüksek Soru Kombosu 🔥</div>
        </div>
      </div>

      <div class="themes-breakdown-card glass-panel" style="margin-bottom: 24px;">
        <h3 style="font-family: var(--font-heading); margin-bottom: 14px;">📚 8 Maarif Teması Kazanım & İlerleme Tablosu</h3>
        ${themesBreakdownHtml}
      </div>

      <div class="glass-panel" style="padding: 20px; text-align: center;">
        <p style="color: var(--text-muted); font-size: 0.88rem; margin-bottom: 12px;">İlerlemenizi sıfırlayıp baştan başlamak ister misiniz?</p>
        <button class="ctrl-btn" style="color: var(--accent-rose); border-color: rgba(244,63,94,0.4); margin: 0 auto;" onclick="window.APP.resetAllProgress()">
          ⚠️ İlerlemeyi Sıfırla
        </button>
      </div>
    `;
  }

  // ==========================================================================
  // CONFETTI CELEBRATION
  // ==========================================================================
  function triggerConfetti() {
    const canvas = document.getElementById('confetti-canvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const particles = [];
    const colors = ['#6366f1', '#10b981', '#f59e0b', '#ec4899', '#3b82f6', '#8b5cf6'];

    for (let i = 0; i < 90; i++) {
      particles.push({
        x: canvas.width / 2,
        y: canvas.height / 2,
        vx: (Math.random() - 0.5) * 16,
        vy: (Math.random() - 0.7) * 16,
        size: Math.random() * 8 + 4,
        color: colors[Math.floor(Math.random() * colors.length)],
        rotation: Math.random() * 360,
        vr: (Math.random() - 0.5) * 10,
        alpha: 1
      });
    }

    let frame = 0;
    function anim() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.35; // gravity
        p.rotation += p.vr;
        p.alpha -= 0.012;

        ctx.save();
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.translate(p.x, p.y);
        ctx.rotate((p.rotation * Math.PI) / 180);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
        ctx.restore();
      });

      frame++;
      if (frame < 90) {
        requestAnimationFrame(anim);
      } else {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
    }
    anim();
  }

  // ==========================================================================
  // VIEW SWITCHER & DISPATCHER
  // ==========================================================================
  function switchView(viewName) {
    STATE.currentView = viewName;
    if (window.location.hash !== '#' + viewName) {
      window.location.hash = viewName;
    }

    // Update navigation tabs
    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.classList.toggle('active', btn.getAttribute('data-view') === viewName);
    });

    // Update view containers
    document.querySelectorAll('.view-section').forEach(sec => {
      sec.classList.toggle('active', sec.id === `view-${viewName}`);
    });

    // Render active view
    if (viewName === 'daily') renderDailyView();
    if (viewName === 'flashcard') renderFlashcardView();
    if (viewName === 'quiz') renderQuizView();
    if (viewName === 'directory') renderDirectoryView();
    if (viewName === 'stats') renderStatsView();
  }

  function updateUI() {
    switchView(STATE.currentView);
  }

  // ==========================================================================
  // QUIZ LOGIC
  // ==========================================================================
  function startQuiz() {
    const modeSelect = document.getElementById('quiz-mode-select');
    const sourceSelect = document.getElementById('quiz-source-select');
    const countSelect = document.getElementById('quiz-count-select');
    const levelSelect = document.getElementById('quiz-level-select');

    const mode = modeSelect ? modeSelect.value : 'en-tr';
    const source = sourceSelect ? sourceSelect.value : 'daily';
    const countVal = countSelect ? countSelect.value : '10';
    const levelVal = levelSelect ? levelSelect.value : 'all';

    let pool = [];
    if (source === 'daily') {
      pool = WORDS_DATA.filter(w => w.day === STATE.currentDay);
    } else if (source === 'review') {
      pool = WORDS_DATA.filter(w => STATE.userData.review.has(w.id));
    } else {
      pool = WORDS_DATA;
    }

    if (levelVal !== 'all') {
      pool = pool.filter(w => w.cefr === levelVal);
    }

    if (pool.length < 4) {
      alert('Seçilen kriterlerde yeterli kelime (en az 4) bulunamadı. Lütfen tüm kelimeleri seçin.');
      return;
    }

    // Shuffle pool
    const shuffled = [...pool].sort(() => Math.random() - 0.5);
    const qCount = countVal === 'all' ? shuffled.length : Math.min(parseInt(countVal, 10), shuffled.length);
    const selectedTargets = shuffled.slice(0, qCount);

    const questions = selectedTargets.map(target => {
      // Pick 3 distractors
      const distractors = WORDS_DATA
        .filter(w => w.id !== target.id)
        .sort(() => Math.random() - 0.5)
        .slice(0, 3);

      const options = [target, ...distractors]
        .sort(() => Math.random() - 0.5)
        .map(w => ({
          id: w.id,
          text: mode === 'tr-en' ? w.en : w.tr,
          isCorrect: w.id === target.id
        }));

      return {
        targetWord: target,
        options: options
      };
    });

    STATE.quizState = {
      active: true,
      questions: questions,
      currentIndex: 0,
      score: 0,
      streak: 0,
      mode: mode,
      source: source,
      answered: false
    };

    renderQuizView();
  }

  function handleQuizAnswer(optionIdx) {
    if (STATE.quizState.answered) return;
    STATE.quizState.answered = true;

    const currentQ = STATE.quizState.questions[STATE.quizState.currentIndex];
    const selectedOpt = currentQ.options[optionIdx];
    const optionBtns = document.querySelectorAll('.quiz-opt-btn');

    optionBtns.forEach((btn, idx) => {
      btn.disabled = true;
      if (currentQ.options[idx].isCorrect) {
        btn.classList.add('correct');
      } else if (idx === optionIdx) {
        btn.classList.add('wrong');
      }
    });

    if (selectedOpt.isCorrect) {
      STATE.quizState.score++;
      STATE.quizState.streak++;
      playSound('correct');
    } else {
      STATE.quizState.streak = 0;
      playSound('wrong');
      // Mark as review
      STATE.userData.review.add(currentQ.targetWord.id);
      saveUserData();
    }

    setTimeout(() => {
      STATE.quizState.currentIndex++;
      STATE.quizState.answered = false;
      renderQuizView();
    }, 1100);
  }

  function quitQuiz() {
    STATE.quizState.active = false;
    renderQuizView();
  }

  function replayQuizAudio() {
    const qState = STATE.quizState;
    if (qState.active && qState.questions[qState.currentIndex]) {
      speakWord(qState.questions[qState.currentIndex].targetWord.en);
    }
  }

  // ==========================================================================
  // FLASHCARD ACTIONS
  // ==========================================================================
  function nextFlashcard() {
    if (STATE.filteredFlashcards.length === 0) return;
    STATE.activeFlashcardIndex = (STATE.activeFlashcardIndex + 1) % STATE.filteredFlashcards.length;
    STATE.flashcardFlipped = false;
    renderFlashcardView();
  }

  function prevFlashcard() {
    if (STATE.filteredFlashcards.length === 0) return;
    STATE.activeFlashcardIndex = (STATE.activeFlashcardIndex - 1 + STATE.filteredFlashcards.length) % STATE.filteredFlashcards.length;
    STATE.flashcardFlipped = false;
    renderFlashcardView();
  }

  function shuffleFlashcards() {
    STATE.filteredFlashcards.sort(() => Math.random() - 0.5);
    STATE.activeFlashcardIndex = 0;
    STATE.flashcardFlipped = false;
    renderFlashcardView();
  }

  function startDailyFlashcards() {
    STATE.flashcardSource = 'daily';
    STATE.activeFlashcardIndex = 0;
    STATE.flashcardFlipped = false;
    switchView('flashcard');
  }

  function startDailyQuiz() {
    STATE.quizState.active = false;
    switchView('quiz');
    setTimeout(() => {
      const srcSelect = document.getElementById('quiz-source-select');
      if (srcSelect) srcSelect.value = 'daily';
      startQuiz();
    }, 100);
  }

  function resetAllProgress() {
    if (confirm('Tüm öğrenme geçmişiniz ve istatistikleriniz sıfırlanacak. Emin misiniz?')) {
      STATE.userData.learned.clear();
      STATE.userData.review.clear();
      STATE.userData.starred.clear();
      STATE.userData.stats = { quizzesPlayed: 0, correctAnswers: 0, totalQuestions: 0, bestStreak: 0 };
      STATE.currentDay = 1;
      saveUserData();
      updateUI();
    }
  }

  // ==========================================================================
  // KEYBOARD SHORTCUTS
  // ==========================================================================
  window.addEventListener('keydown', (e) => {
    // Only handle if not typing in input
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA') {
      return;
    }

    if (STATE.currentView === 'flashcard' && STATE.filteredFlashcards.length > 0) {
      const currentWord = STATE.filteredFlashcards[STATE.activeFlashcardIndex];
      if (e.code === 'Space') {
        e.preventDefault();
        STATE.flashcardFlipped = !STATE.flashcardFlipped;
        playSound('flip');
        document.getElementById('flashcard-inner')?.classList.toggle('flipped', STATE.flashcardFlipped);
      } else if (e.code === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
        e.preventDefault();
        nextFlashcard();
      } else if (e.code === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
        e.preventDefault();
        prevFlashcard();
      } else if (e.key === 'p' || e.key === 'P' || e.code === 'Enter') {
        e.preventDefault();
        speakWord(currentWord.en);
      } else if (e.key === '1') {
        e.preventDefault();
        toggleReview(currentWord.id);
        nextFlashcard();
      } else if (e.key === '2') {
        e.preventDefault();
        toggleLearned(currentWord.id);
        nextFlashcard();
      }
    }
  });

  // ==========================================================================
  // INITIALIZATION & SETTINGS BINDINGS
  // ==========================================================================
  function initApp() {
    // Apply theme
    document.documentElement.setAttribute('data-theme', STATE.settings.theme);

    // Bind Navigation Buttons
    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const view = btn.getAttribute('data-view');
        switchView(view);
      });
    });

    // Accent Switcher (UK / US)
    const accentBtn = document.getElementById('accent-toggle-btn');
    if (accentBtn) {
      accentBtn.innerHTML = STATE.settings.accent === 'en-GB' ? '🇬🇧 UK' : '🇺🇸 US';
      accentBtn.addEventListener('click', () => {
        STATE.settings.accent = STATE.settings.accent === 'en-GB' ? 'en-US' : 'en-GB';
        localStorage.setItem('mk_accent', STATE.settings.accent);
        accentBtn.innerHTML = STATE.settings.accent === 'en-GB' ? '🇬🇧 UK' : '🇺🇸 US';
      });
    }

    // Speed Switcher (1x / 0.8x)
    const speedBtn = document.getElementById('speed-toggle-btn');
    if (speedBtn) {
      speedBtn.innerHTML = `⚡ ${STATE.settings.speed}x`;
      speedBtn.addEventListener('click', () => {
        STATE.settings.speed = STATE.settings.speed === 1.0 ? 0.8 : 1.0;
        localStorage.setItem('mk_speed', STATE.settings.speed.toString());
        speedBtn.innerHTML = `⚡ ${STATE.settings.speed}x`;
      });
    }

    // Sound effects toggle
    const soundBtn = document.getElementById('sound-toggle-btn');
    if (soundBtn) {
      soundBtn.innerHTML = STATE.settings.soundEffects ? '🔔 Ses Açık' : '🔕 Sessiz';
      soundBtn.addEventListener('click', () => {
        STATE.settings.soundEffects = !STATE.settings.soundEffects;
        localStorage.setItem('mk_sound', STATE.settings.soundEffects.toString());
        soundBtn.innerHTML = STATE.settings.soundEffects ? '🔔 Ses Açık' : '🔕 Sessiz';
      });
    }

    // Theme toggle (Dark / Light)
    const themeBtn = document.getElementById('theme-toggle-btn');
    if (themeBtn) {
      themeBtn.innerHTML = STATE.settings.theme === 'dark' ? '☀️ Açık' : '🌙 Koyu';
      themeBtn.addEventListener('click', () => {
        STATE.settings.theme = STATE.settings.theme === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', STATE.settings.theme);
        localStorage.setItem('mk_theme', STATE.settings.theme);
        themeBtn.innerHTML = STATE.settings.theme === 'dark' ? '☀️ Açık' : '🌙 Koyu';
      });
    }

    // Initial view render with hash routing
    const validViews = ['daily', 'flashcard', 'quiz', 'directory', 'stats'];
    const initialHash = window.location.hash.replace('#', '');
    const initialView = validViews.includes(initialHash) ? initialHash : 'daily';
    switchView(initialView);

    window.addEventListener('hashchange', () => {
      const hView = window.location.hash.replace('#', '');
      if (validViews.includes(hView) && hView !== STATE.currentView) {
        switchView(hView);
      }
    });

    // Register service worker if available
    if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.hostname === 'localhost')) {
      navigator.serviceWorker.register('./service-worker.js').catch(err => {
        console.log('SW registration note:', err);
      });
    }
  }

  // Export to Global Scope for HTML Event Handlers
  window.APP = {
    toggleLearned,
    toggleReview,
    toggleStarred,
    nextFlashcard,
    prevFlashcard,
    shuffleFlashcards,
    startDailyFlashcards,
    startDailyQuiz,
    startQuiz,
    handleQuizAnswer,
    quitQuiz,
    replayQuizAudio,
    renderFlashcardView,
    resetAllProgress,
    switchView
  };

  document.addEventListener('DOMContentLoaded', initApp);
})();

</script>
